<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Kinoo · Ticket coleccionable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Figtree:ital,wght@0,400;0,600;0,700;0,800;1,600;1,800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}

/* ---- Kinoo · motion v1 ---- */
:root{--k-ease:cubic-bezier(.2,.8,.2,1);--k-in:cubic-bezier(.5,0,.75,0);--k-spring:cubic-bezier(.3,1.4,.5,1)}
@keyframes kscreen{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kstagger{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes kfanin{from{opacity:0;transform:translateY(46px) scale(.9)}to{opacity:1;transform:none}}
@keyframes kdealf{from{opacity:.4;transform:translateY(14px) scale(.93)}to{opacity:1;transform:none}}
@keyframes kdealin{from{opacity:0;transform:translateY(-70px) rotate(-7deg) scale(.88)}to{opacity:1;transform:none}}
@keyframes kswap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kgrow{from{transform:scaleX(0)}to{transform:none}}
@keyframes knudge{50%{transform:translate(3px,-3px)}}
.kfin{animation:kscreen .42s var(--k-ease) both}
.kpress{transition:transform .14s var(--k-ease),filter .14s}
.kpress:active{transform:scale(.97);filter:brightness(1.08)}
.kstag>*{animation:kstagger .5s var(--k-ease) both}
.kstag>*:nth-child(1){animation-delay:.04s}.kstag>*:nth-child(2){animation-delay:.09s}.kstag>*:nth-child(3){animation-delay:.14s}.kstag>*:nth-child(4){animation-delay:.19s}
.kstag>*:nth-child(5){animation-delay:.24s}.kstag>*:nth-child(6){animation-delay:.29s}.kstag>*:nth-child(7){animation-delay:.34s}.kstag>*:nth-child(8){animation-delay:.39s}
.kfan{animation:kfanin .6s var(--k-spring) both}
.kdealf{animation:kdealf .34s var(--k-spring) both}
.kdealin{animation:kdealin .52s var(--k-spring) both}
.kswap{animation:kswap .3s var(--k-ease) both}
.knudge{display:inline-block;animation:knudge 1.6s var(--k-ease) infinite}
a,button,[role=button]{-webkit-tap-highlight-color:transparent}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
<style>html,body{margin:0;background:#17120f;-webkit-tap-highlight-color:transparent;scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}#kdc-root{width:402px;margin:0 auto}</style>
</head>
<body>
<div id="kdc-root"></div>
<template id="kdc-tpl">

<div class="kfin" style="position:relative;width:402px;height:844px;overflow:hidden;background:#17120f;font-family:'Figtree',sans-serif;color:#f4e7d0;display:flex;flex-direction:column;align-items:center">

  <div style="width:390px;flex:none;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px 20px">

      <div style="width:44px;height:44px;box-sizing:border-box;border:2px solid #ce7e01;border-radius:22px;background:#221a15;display:flex;align-items:center;justify-content:center">

      </div>
    </div>
  </div>

  <div style="width:100%;flex:none;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:28px;padding:42px 26px 40px">

    <!-- Entrada coleccionable -->
    <div style="width:100%;display:flex;flex-direction:column;align-items:flex-start;border-radius:18px;overflow:hidden;background:#f4e7d0;box-shadow:0 16px 28px rgba(0,0,0,0.31)">

      <div style="width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:#5e0c10;color:#f4e7d0;white-space:nowrap;overflow:hidden">
        <p style="margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:23px;line-height:normal">KINOO</p>
        <p style="margin:0;font-weight:800;font-size:10px;line-height:normal">TICKET DEL MAZO</p>
      </div>

      <div style="width:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 20px 14px;overflow:hidden">
        <div style="width:100%;text-align:center;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:40px;line-height:0.94;text-transform:uppercase;color:#1a1411">
          <p style="margin:0">{{title}}</p>
        </div>

        <div style="position:relative;flex:none;width:310px;height:207px">
          <div style="position:absolute;left:7px;top:4.87px;width:146.306px;height:189.01px;display:flex;align-items:center;justify-content:center">
            <div style="flex:none;transform:rotate(-11deg)">
              <div style="box-sizing:border-box;width:116px;height:170px;padding:3px;border-radius:5px;background:#1a1411;box-shadow:0 7px 12px rgba(0,0,0,0.33);overflow:hidden">
                <img src="{{p1.img}}" alt="{{p1.t}}" style="display:block;width:100%;height:100%;object-fit:cover;border-radius:2px">
              </div>
            </div>
          </div>
          <div style="position:absolute;left:163.48px;top:12px;width:143.758px;height:187.561px;display:flex;align-items:center;justify-content:center">
            <div style="flex:none;transform:rotate(10deg)">
              <div style="box-sizing:border-box;width:116px;height:170px;padding:3px;border-radius:5px;background:#1a1411;box-shadow:0 7px 12px rgba(0,0,0,0.33);overflow:hidden">
                <img src="{{p2.img}}" alt="{{p2.t}}" style="display:block;width:100%;height:100%;object-fit:cover;border-radius:2px">
              </div>
            </div>
          </div>
          <div style="position:absolute;left:90px;top:3px;box-sizing:border-box;width:130px;height:191px;padding:3px;border-radius:5px;background:#1a1411;box-shadow:0 7px 12px rgba(0,0,0,0.33);overflow:hidden">
            <div style="position:relative;width:100%;height:100%;border-radius:2px;overflow:hidden">
              <img src="{{p0.img}}" alt="{{p0.t}}" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover">
            </div>
          </div>
        </div>

        <p style="margin:0;width:100%;font-family:'Figtree',sans-serif;font-style:italic;font-weight:600;font-size:19px;line-height:24px;text-align:center;color:#1a1411">{{line}}</p>
      </div>

      <!-- Troquel -->
      <div style="position:relative;width:100%;height:20px;box-sizing:border-box;display:flex;align-items:center;padding:0 18px">
        <div style="flex:1;min-width:0;height:0;border-top:1px dashed #b3a283"></div>
        <div style="position:absolute;left:-7px;top:3px;width:14px;height:14px;border-radius:7px;background:#17120f"></div>
        <div style="position:absolute;right:-7px;top:3px;width:14px;height:14px;border-radius:7px;background:#17120f"></div>
      </div>

      <div style="width:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:15px;padding:8px 20px 20px;overflow:hidden">
        <div style="width:100%;display:flex;align-items:center;justify-content:center;gap:30px">
          <div style="display:flex;align-items:center;gap:8px">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="6.2" stroke="#d9541f" stroke-width="2.6"/></svg>
            <p style="margin:0;font-weight:700;font-size:16px;line-height:normal;color:#1a1411">{{nW}}</p>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6.8" fill="#1a1411"/></svg>
            <p style="margin:0;font-weight:700;font-size:16px;line-height:normal;color:#1a1411">{{nS}}</p>
          </div>
          <div style="display:flex;align-items:center;gap:8px;color:#1a1411">
            <p style="margin:0;font-weight:400;font-size:19px;line-height:normal">✕</p>
            <p style="margin:0;font-weight:700;font-size:16px;line-height:normal">{{nP}}</p>
          </div>
        </div>
        <div style="display:flex;justify-content:center;gap:2px;height:18px" aria-hidden="true">
          <div style="width:2px;height:18px;background:#1a1411"></div><div style="width:1px;height:18px;background:#1a1411"></div><div style="width:3px;height:18px;background:#1a1411"></div><div style="width:1px;height:18px;background:#1a1411"></div><div style="width:4px;height:18px;background:#1a1411"></div><div style="width:2px;height:18px;background:#1a1411"></div><div style="width:1px;height:18px;background:#1a1411"></div><div style="width:3px;height:18px;background:#1a1411"></div><div style="width:2px;height:18px;background:#1a1411"></div><div style="width:1px;height:18px;background:#1a1411"></div><div style="width:4px;height:18px;background:#1a1411"></div><div style="width:1px;height:18px;background:#1a1411"></div><div style="width:2px;height:18px;background:#1a1411"></div><div style="width:3px;height:18px;background:#1a1411"></div><div style="width:1px;height:18px;background:#1a1411"></div><div style="width:2px;height:18px;background:#1a1411"></div><div style="width:4px;height:18px;background:#1a1411"></div><div style="width:1px;height:18px;background:#1a1411"></div><div style="width:3px;height:18px;background:#1a1411"></div><div style="width:1px;height:18px;background:#1a1411"></div>
        </div>
      </div>
    </div>

    <!-- Acciones -->
    <div style="width:100%;display:flex;flex-direction:column;gap:4px;overflow:hidden">
      <div style="box-sizing:border-box;width:100%;height:58px;display:flex;align-items:center;justify-content:center;gap:10px;border:2px solid #f4e7d0;border-radius:29px;background:#5e0c10;overflow:hidden">
        <span style="font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:24px;line-height:normal;text-transform:uppercase;color:#f4e7d0;white-space:nowrap">Compartir recibo</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f4e7d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
      </div>
      <a href="Final_Resumen.dc.html" style="height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;line-height:normal;color:#d9c7a8;text-decoration:underline;white-space:nowrap">Volver al cierre</a>
    </div>
  </div>
</div>
</template>
<script type="text/x-dc" id="kdc-logic">
class Component extends DCLogic {
_deckIx() { try { const v = parseInt(window.localStorage.getItem('kinoo.deck'), 10); return v >= 0 && v < 3 ? v : 0; } catch (_) { return 0; } }
_res() { try { const o = JSON.parse(window.localStorage.getItem('kinoo.res') || 'null'); return o && o.d === this._deckIx() && Array.isArray(o.r) && o.r.length ? o.r : null; } catch (_) { return null; } }
_sum() {
  const D = [{"title":"Para llorar bonito","theme":"Despedidas que abrazan","summary":"En tus elecciones se repiten despedidas, familias que se eligen y amores que no alcanzaron. Este mazo celebra lo que se queda.","line":"Hay despedidas que también son abrazos.","ticket":"Hoy te movieron las despedidas.","aff":[["Despedidas",5],["Familia elegida",4],["Amor a destiempo",3]],"films":[{"id":"robot","t":"Robot salvaje","img":"../assets/9fbaad203f3fe82fa4f9cdbfb2f69e3c.jpg"},{"id":"her","t":"Her","img":"../assets/a8e3a123c957ecab03c0064c9784365d.jpg"},{"id":"toystory3","t":"Toy Story 3","img":"../assets/303d601294b204ae47044fbaf8889753.jpg"},{"id":"coco","t":"Coco","img":"../assets/835e4fdd55dd260b350950e4874297a9.jpg"},{"id":"titanic","t":"Titanic","img":"../assets/6ffb31d0f49ae2b65b844ee3350dcb3b.jpg"},{"id":"novia","t":"El cadáver de la novia","img":"../assets/04ddf7d4af0d85785462f8a564cb5c98.jpg"},{"id":"balboa","t":"Rocky Balboa","img":"../assets/8cfbfb4f6496ba64b79bc7d8ba267f52.jpg"},{"id":"hailmary","t":"Fin del Mundo","img":"../assets/58a51b8c46cb57a1527442eac2fa8f00.jpg"},{"id":"eeaao","t":"Todo en todas partes","img":"../assets/22037a4748403261649cf650946d28ca.jpg"},{"id":"padrino3","t":"El Padrino III","img":"../assets/4bf6fa6ea35486e09de4d353df3e38ec.jpg"}]},{"title":"Mundos al borde del fin","theme":"El peso del elegido","summary":"En tus elecciones aparecen elegidos, futuros que hay que corregir y mundos a punto de caer. Este mazo celebra a quien carga con todo.","line":"Siempre hay alguien que carga con el mundo.","ticket":"Hoy elegiste mundos al límite.","aff":[["Destino",5],["Futuros rotos",4],["Héroes cansados",3]],"films":[{"id":"dune","t":"Dune","img":"../assets/9573c13f985149da157954b6a081cf1f.jpg"},{"id":"matrix","t":"Matrix","img":"../assets/c7cf6f2dd558a8d1689c4180a9a6c8d0.jpg"},{"id":"terminator","t":"Terminator","img":"../assets/10e84e61d6e452f9d0cc0e7887b3e95a.jpg"},{"id":"xmen","t":"Días del futuro pasado","img":"../assets/15d276fc3093331a6540322811264eb2.jpg"},{"id":"mickey","t":"Mickey 17","img":"../assets/3666c0c942517c16dc1d43a68f8aec74.jpg"},{"id":"watchmen","t":"Watchmen","img":"../assets/d04989f943a61cefa250cfab12f805ff.jpg"},{"id":"superman","t":"Superman","img":"../assets/1fa53a0d1b3ca5dc1aac0b4ae72a985d.jpg"},{"id":"wwz","t":"Guerra Mundial Z","img":"../assets/e7f73487294cb238033203c0fbafdd91.jpg"},{"id":"tdk","t":"El caballero de la noche","img":"../assets/66900b321db1f062d0128467d0e5752c.jpg"},{"id":"mk1","t":"Mortal Kombat","img":"../assets/8f370ef20b2471d54a7ec349a33cf7d5.jpg"}]},{"title":"Lo que guardaron Ana y Leo","theme":"Miedo que se queda","summary":"En tus elecciones se repiten casas que asustan, familias con secretos y males que se heredan. Este mazo celebra el miedo bien hecho.","line":"El miedo también es una forma de compañía.","ticket":"Hoy elegiste el miedo bien hecho.","aff":[["Familias con secretos",5],["Males heredados",4],["Lugares que asustan",3]],"films":[{"id":"acecha","t":"Cuando acecha la maldad","img":"../assets/4c1b4a59659db5db7069a292d9d749e5.jpg"},{"id":"hereditary","t":"El legado del diablo","img":"../assets/3ec4e23d90e08b95c83d177461e77b5c.jpg"},{"id":"resplandor","t":"El resplandor","img":"../assets/1d39daa246925914d12f6ba96c33be31.jpg"},{"id":"getout","t":"¡Huye!","img":"../assets/b164a4d987a9ee4aae8cc3f5838d1f9d.jpg"},{"id":"exorcista","t":"El exorcista","img":"../assets/1bad5f3021bcb61d65f6f032aa38eb84.jpg"},{"id":"nosferatu","t":"Nosferatu","img":"../assets/559e84b3d31941c96393966e19b9c566.jpg"},{"id":"sinners","t":"Pecadores","img":"../assets/21604378bddbf76583a6155e67cc7ec1.jpg"},{"id":"halloween","t":"Halloween","img":"../assets/3afa20d1a4b0868267f1c59b42fba8ea.jpg"},{"id":"smile","t":"Sonríe","img":"../assets/029cd50651052ca171f0734960628b17.jpg"},{"id":"papa","t":"El exorcista del papa","img":"../assets/7d8562d25906ec612fec4c3ee8b14bb6.jpg"}]}];
  const ix = this._deckIx(), d = D[ix];
  const def = ['want', 'pass', 'want', 'seen', 'pass', 'want', 'pass', 'pass', 'want', 'pass'];
  const r = this._res() || def;
  const want = [], seen = [];
  r.forEach((k, i) => { if (!d.films[i]) return; if (k === 'want') want.push(d.films[i]); if (k === 'seen') seen.push(d.films[i]); });
  const nW = want.length, nS = seen.length, nP = r.filter((k) => k === 'pass').length, nC = nW + nS;
  const pool = want.concat(seen).length ? want.concat(seen) : d.films.slice(0, 3);
  return { d, ix, nW, nS, nP, nC, want, pool };
}
renderVals() {
  const M = this._sum();
  const p = M.pool.concat(M.d.films).slice(0, 3);
  return { title: M.d.title, line: M.d.ticket, nW: M.nW, nS: M.nS, nP: M.nP, p0: p[0], p1: p[1], p2: p[2] };
}
}
</script>
