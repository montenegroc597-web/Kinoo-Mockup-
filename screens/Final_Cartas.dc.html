<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402, user-scalable=no">
<title>Kinoo · Descubrir — mazo de 10 cartas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Figtree:ital,wght@0,400;0,600;0,700;0,800;1,600;1,800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}

/* ---- Kinoo · motion v1 ---- */
:root{--k-ease:cubic-bezier(.2,.8,.2,1);--k-in:cubic-bezier(.5,0,.75,0);--k-spring:cubic-bezier(.3,1.4,.5,1)}
@keyframes kscreen{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kstagger{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes kfanin{from{opacity:0;transform:translateY(46px) scale(.9)}to{opacity:1;transform:none}}
@keyframes kdealf{from{opacity:.4;transform:translateY(14px) scale(.93)}to{opacity:1;transform:none}}
@keyframes kdealin{from{opacity:0;transform:translateY(-70px) rotate(-7deg) scale(.88)}to{opacity:1;transform:none}}
@keyframes kswap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kgrow{from{transform:scaleX(0)}to{transform:none}}
@keyframes knudge{50%{transform:translate(3px,-3px)}}
.kfin{animation:kscreen .42s var(--k-ease) both}
.kpress{transition:transform .14s var(--k-ease),filter .14s}
.kpress:active{transform:scale(.97);filter:brightness(1.08)}
.kstag>*{animation:kstagger .5s var(--k-ease) both}
.kstag>*:nth-child(1){animation-delay:.04s}.kstag>*:nth-child(2){animation-delay:.09s}.kstag>*:nth-child(3){animation-delay:.14s}.kstag>*:nth-child(4){animation-delay:.19s}
.kstag>*:nth-child(5){animation-delay:.24s}.kstag>*:nth-child(6){animation-delay:.29s}.kstag>*:nth-child(7){animation-delay:.34s}.kstag>*:nth-child(8){animation-delay:.39s}
.kfan{animation:kfanin .6s var(--k-spring) both}
.kdealf{animation:kdealf .34s var(--k-spring) both}
.kdealin{animation:kdealin .52s var(--k-spring) both}
.kswap{animation:kswap .3s var(--k-ease) both}
.knudge{display:inline-block;animation:knudge 1.6s var(--k-ease) infinite}
a,button,[role=button]{-webkit-tap-highlight-color:transparent}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
<style>html,body{margin:0;background:#17120f;-webkit-tap-highlight-color:transparent;scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}#kdc-root{width:402px;margin:0 auto}</style>
</head>
<body>
<div id="kdc-root"></div>
<template id="kdc-tpl">

<div class="kfin" style="position:relative;width:402px;height:874px;overflow:hidden;background:#17120f;font-family:'Figtree',sans-serif;color:#f4e7d0;user-select:none;-webkit-user-select:none">

  <!-- Encabezado -->
  <div style="position:absolute;left:6px;top:0;width:390px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px 20px">
    <p style="margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:32px;line-height:32px;letter-spacing:0.5px;color:#f4e7d0">Kinoo</p>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="box-sizing:border-box;border:1px solid #8a7458;border-radius:15px;padding:8px 13px;display:flex">
        <p style="margin:0;font-weight:600;font-size:12px;line-height:14px;letter-spacing:1.2px;text-transform:uppercase;color:#d9c7a8;white-space:nowrap">{{chip}}</p>
      </div>
      <div style="width:44px;height:44px;box-sizing:border-box;border:2px solid #ce7e01;border-radius:22px;background:#221a15;display:flex;align-items:center;justify-content:center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f4e7d0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21v-1a5.5 5.5 0 0 1 5.5-5.5h4a5.5 5.5 0 0 1 5.5 5.5v1"/></svg>
      </div>
    </div>
  </div>

  <!-- Progreso -->
  <div style="position:absolute;left:6px;top:64px;width:390px;box-sizing:border-box;padding:6px 20px 4px 20px">
    <div style="display:flex;align-items:center;gap:10px;width:100%">
      <div style="flex:1;min-width:0;display:flex;gap:3px;height:4px">
        <sc-for list="{{segs}}" as="sg" hint-placeholder-count="10">
          <div style="flex:1;height:100%;border-radius:2px;background:{{sg.bg}}"></div>
        </sc-for>
      </div>
      <p style="margin:0;font-weight:600;font-size:12px;line-height:14px;color:#bfa98a;white-space:nowrap">{{counter}}</p>
    </div>
  </div>

  <!-- Carta de abajo (siguiente) -->
  <sc-if value="{{showNext}}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;left:26px;top:96px;width:350px;height:564px;box-sizing:border-box;border:3px solid #f4e7d0;border-radius:20px;background:#5e0c10;opacity:0.85;transform:translateY(10px) scale(0.96);overflow:hidden">
      <div style="position:absolute;left:115px;top:210px;width:120px;height:120px;border-radius:60px;background:#f2b544;opacity:0.9"></div>
      <div style="position:absolute;left:140px;top:235px;width:70px;height:70px;border-radius:35px;background:#f4e7d0"></div>
    </div>
  </sc-if>

  <!-- Carta activa -->
  <sc-if value="{{inDeck}}" hint-placeholder-val="{{ true }}">
    <div onPointerDown="{{onDown}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerCancel="{{onCancel}}" style="position:absolute;left:26px;top:96px;width:350px;height:564px;perspective:{{persp}};touch-action:none;cursor:grab;transform:{{dragT}};transition:{{dragTr}};z-index:3">
      <div style="position:absolute;left:0;top:0;width:350px;height:564px;transform-style:{{ts}};-webkit-transform-style:{{ts}};transform:{{flipT}};transition:{{flipTr}}">

        <!-- CARA FRONTAL -->
        <div style="position:absolute;left:0;top:0;width:350px;height:564px;box-sizing:border-box;border:3px solid #f4e7d0;border-radius:20px;padding:3px;overflow:hidden;background:#5e0c10;box-shadow:0 6px 16px rgba(0,0,0,0.35);backface-visibility:{{bfv}};-webkit-backface-visibility:{{bfv}};visibility:{{frontVis}}">
          <div style="position:relative;width:100%;height:100%">
            <div style="position:absolute;left:18px;top:16px;width:308px;display:flex;align-items:center;justify-content:space-between">
              <div style="height:25px;box-sizing:border-box;display:flex;align-items:flex-start;padding:6px 10px;border-radius:12.5px;background:#f4e7d0">
                <p style="margin:0;font-weight:800;font-size:11px;line-height:13px;letter-spacing:1.4px;text-transform:uppercase;color:#1a1411;white-space:nowrap">Premisa</p>
              </div>
              <div style="display:flex;align-items:center;gap:6px">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#f4e7d0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M8 16H3v5"/></svg>
                <p style="margin:0;font-weight:700;font-size:12px;line-height:14px;color:#f4e7d0;white-space:nowrap">Toca para revelar</p>
              </div>
            </div>

            <div style="position:absolute;left:18px;top:53px;width:267px;display:flex;flex-direction:column;gap:4px">
              <p style="margin:0;font-style:italic;font-weight:600;font-size:22px;line-height:22px;color:#f2b544">{{card.kicker}}</p>
              <p style="margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:{{card.premSize}}px;line-height:{{card.premLh}}px;text-transform:uppercase;color:#f4e7d0">{{card.premise}}</p>
            </div>

            <div style="position:absolute;left:18px;top:148px;height:101px;display:flex;flex-direction:column;gap:5px;color:#f4e7d0;white-space:nowrap">
              <p style="margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:112px;line-height:87.4px">{{card.match}}</p>
              <p style="margin:0;font-weight:800;font-size:10px;line-height:13px;letter-spacing:1.4px;text-transform:uppercase">% contigo</p>
            </div>

            <div style="position:absolute;left:202px;top:155px;width:117px;height:87px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:6px">
              <sc-for list="{{card.tags}}" as="tg" hint-placeholder-count="3">
                <div style="height:24px;box-sizing:border-box;border:1px solid #8a7458;border-radius:12px;padding:5px 11px;display:flex"><p style="margin:0;font-weight:600;font-size:12px;line-height:14px;color:#d9c7a8;white-space:nowrap">{{tg}}</p></div>
              </sc-for>
            </div>

            <div style="position:absolute;left:18px;top:268px;width:308px;display:flex;flex-direction:column">
              <sc-for list="{{card.rows}}" as="r" hint-placeholder-count="4">
                <div style="height:61px;box-sizing:border-box;border-top:1px solid #f4e7d0;padding:9px 0 8px;display:flex;align-items:flex-start;gap:12px">
                  <div style="flex:none;width:44px;height:44px;border-radius:12px;background:{{r.bg}};display:flex;align-items:center;justify-content:center">
                    <sc-if value="{{r.isRitmo}}" hint-placeholder-val="{{ true }}">
                      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true"><path d="M4.5 16.5C8 11 11.5 11 15 15.5S22 20 25.5 14" stroke="#f4e7d0" stroke-width="2" stroke-linecap="round"/><circle cx="6.5" cy="21.5" r="1.3" fill="#f2b544"/><circle cx="23.5" cy="9" r="1.3" fill="#f2b544"/></svg>
                    </sc-if>
                    <sc-if value="{{r.isTono}}" hint-placeholder-val="{{ false }}">
                      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true"><path d="M17.5 7.5A8.5 8.5 0 1 0 22.5 21 7 7 0 0 1 17.5 7.5Z" fill="#f2b544"/><circle cx="8.5" cy="10" r="1.2" fill="#f4e7d0"/><circle cx="24" cy="10" r="1.2" fill="#f4e7d0"/></svg>
                    </sc-if>
                    <sc-if value="{{r.isHistoria}}" hint-placeholder-val="{{ false }}">
                      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true"><path d="M3 24 11 11l4 6 3-4 9 11Z" fill="#1a1411"/><path d="M11 11V4" stroke="#1a1411" stroke-width="1.4" stroke-linecap="round"/><path d="M11 4h4.2l-1.2 1.6 1.2 1.6H11Z" fill="#b83a26"/></svg>
                    </sc-if>
                    <sc-if value="{{r.isVisual}}" hint-placeholder-val="{{ false }}">
                      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true"><path d="M9 22a6 6 0 0 1 12 0Z" fill="#f2b544"/><path d="M4 23.5h22" stroke="#f4e7d0" stroke-width="1.8" stroke-linecap="round"/><path d="M15 5v3M7.5 9.5l1.8 1.8M22.5 9.5l-1.8 1.8" stroke="#f4e7d0" stroke-width="1.6" stroke-linecap="round"/></svg>
                    </sc-if>
                  </div>
                  <div style="width:213px;display:flex;flex-direction:column;gap:2px">
                    <div style="display:flex;align-items:baseline;gap:8px;text-transform:uppercase;white-space:nowrap">
                      <p style="margin:0;font-weight:800;font-size:10px;line-height:13px;letter-spacing:1.2px;color:#f4e7d0">{{r.label}}</p>
                      <p style="margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:20px;line-height:20px;color:#f4e7d0">{{r.value}}</p>
                      <sc-if value="{{r.sparkle}}" hint-placeholder-val="{{ false }}">
                        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l1.4 4.6L12 6 7.4 7.4 6 12 4.6 7.4 0 6l4.6-1.4Z" fill="#f2b544"/></svg>
                      </sc-if>
                    </div>
                    <p style="margin:0;font-weight:400;font-size:12.5px;line-height:15px;color:#d9c7a8">{{r.sub}}</p>
                  </div>
                  <button onPointerDown="{{stop}}" onPointerUp="{{stop}}" onClick="{{r.open}}" aria-label="{{r.aria}}" style="flex:none;width:33px;height:33px;margin:-9px;padding:0;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="box-sizing:border-box;width:15px;height:15px;border:1px solid #f4e7d0;border-radius:7.5px;opacity:0.6;padding:1px;display:flex;justify-content:center"><span style="font-style:italic;font-weight:800;font-size:9.5px;line-height:12px;color:#f4e7d0">i</span></span></button>
                </div>
              </sc-for>
            </div>

            <p style="position:absolute;left:18px;top:528px;margin:0;font-weight:400;font-size:12.5px;line-height:15px;color:#bfa98a;white-space:nowrap">{{card.similar}}</p>
          </div>
        </div>

        <!-- CARA POSTERIOR -->
        <div style="position:absolute;left:0;top:-3px;width:350px;height:564px;box-sizing:border-box;border:2px solid #f4e7d0;border-radius:20px;overflow:hidden;background:#1a1411;transform:{{backT}};backface-visibility:{{bfv}};-webkit-backface-visibility:{{bfv}};visibility:{{backVis}}">
          <div style="position:absolute;left:0;top:0;width:346px;height:383px;overflow:hidden;background:#221a15">
            <sc-if value="{{card.hasImg}}" hint-placeholder-val="{{ true }}">
              <img src="{{card.img}}" alt="" draggable="false" style="{{card.imgStyle}}">
            </sc-if>
            <sc-if value="{{card.noImg}}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;left:0;top:0;width:100%;height:100%;background:{{card.phBg}}">
                <div style="position:absolute;left:113px;top:110px;width:120px;height:120px;border-radius:60px;background:#f2b544"></div>
                <div style="position:absolute;left:138px;top:135px;width:70px;height:70px;border-radius:35px;background:#f4e7d0"></div>
                <p style="position:absolute;left:0;top:300px;width:100%;margin:0;text-align:center;font-weight:800;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:#f4e7d0;opacity:0.8">Póster pendiente</p>
              </div>
            </sc-if>
          </div>
          <div style="position:absolute;left:-2px;top:381px;width:350px;height:2px;background:#f4e7d0"></div>

          <p style="position:absolute;left:20px;top:391px;margin:0;font-style:italic;font-weight:600;font-size:16px;line-height:22px;color:#f2b544;white-space:nowrap">{{card.subtitle}}</p>
          <p style="position:absolute;left:20px;top:413px;margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:{{card.titleSize}}px;line-height:38px;text-transform:uppercase;color:#f4e7d0;white-space:nowrap">{{card.title}}</p>

          <div style="position:absolute;left:17px;top:461px;display:flex;gap:8px">
            <div style="box-sizing:border-box;border:1px solid #5a4838;border-radius:12px;padding:5px 11px;display:flex;align-items:center"><p style="margin:0;font-weight:600;font-size:12px;line-height:14px;color:#e6d3b3;white-space:nowrap">{{card.dur}}</p></div>
            <div style="box-sizing:border-box;border:1px solid #5a4838;border-radius:12px;padding:5px 11px;display:flex;align-items:center"><p style="margin:0;font-weight:600;font-size:12px;line-height:14px;color:#e6d3b3;white-space:nowrap">{{card.genre}}</p></div>
            <div style="box-sizing:border-box;border:1px solid #5a4838;border-radius:12px;padding:5px 11px;display:flex;align-items:center"><p style="margin:0;font-weight:600;font-size:12px;line-height:14px;color:#e6d3b3;white-space:nowrap">{{card.year}}</p></div>
          </div>

          <p style="position:absolute;left:20px;top:492px;width:305.5px;margin:0;font-weight:400;font-size:14px;line-height:19.6px;color:#d9c7a8">{{card.desc}} <span style="font-weight:700;color:#f2b544">Ver mas</span></p>

          <button onPointerDown="{{stop}}" onPointerUp="{{stop}}" onClick="{{openAdn}}" aria-label="Ver el ADN de la película" style="position:absolute;left:7px;top:7px;height:44px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;padding:2px 18px;border:2px solid #f4e7d0;border-radius:20px;background:#f4e7d0;cursor:pointer;font:inherit">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1l1.7 5.3L15 8l-5.3 1.7L8 15l-1.7-5.3L1 8l5.3-1.7Z" fill="#f2b544"/></svg>
            <p style="margin:0;font-weight:700;font-size:15px;line-height:18px;color:#1a1411;white-space:nowrap">ADN</p>
          </button>

          <div style="position:absolute;left:16px;top:341px;box-sizing:border-box;height:34px;padding:3px 12px;display:flex;align-items:flex-start;border-radius:20px;background:#f4e7d0;overflow:hidden">
            <div style="display:flex;align-items:center;gap:6px;height:28px">
              <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5Z" fill="#1a1411"/></svg>
              <p style="margin:0;font-weight:700;font-size:12px;line-height:normal;color:#1a1411;white-space:nowrap">Tráiler</p>
            </div>
          </div>

          <div title="Disponible en {{card.platN}}" style="position:absolute;left:280px;top:9px;width:44px;height:44px;box-sizing:border-box;border-radius:11px;overflow:hidden;background:{{card.platBg}};padding:{{card.platPad}}px;box-shadow:0 4px 12px rgba(0,0,0,.45)">
            <img src="{{card.platLogo}}" alt="{{card.platN}}" draggable="false" style="display:block;width:100%;height:100%;object-fit:cover">
          </div>
        </div>
      </div>

      <!-- Sellos de swipe -->
      <div style="position:absolute;left:18px;top:26px;transform:rotate(-8deg);opacity:{{opWant}};pointer-events:none;z-index:5;box-sizing:border-box;border:3px solid #f4e7d0;border-radius:12px;background:#5e0c10;padding:4px 12px">
        <span style="font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:28px;line-height:30px;text-transform:uppercase;color:#f4e7d0">Quiero verla</span>
      </div>
      <div style="position:absolute;right:18px;top:26px;transform:rotate(8deg);opacity:{{opPass}};pointer-events:none;z-index:5;box-sizing:border-box;border:3px solid #f4e7d0;border-radius:12px;background:#17120f;padding:4px 12px">
        <span style="font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:28px;line-height:30px;text-transform:uppercase;color:#f4e7d0">No me interesa</span>
      </div>
      <div style="position:absolute;left:96px;bottom:36px;opacity:{{opSeen}};pointer-events:none;z-index:5;box-sizing:border-box;border:3px solid #1a1411;border-radius:12px;background:#f2b544;padding:4px 14px">
        <span style="font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:28px;line-height:30px;text-transform:uppercase;color:#1a1411">Ya la vi</span>
      </div>
    </div>
  </sc-if>

  <!-- Fin del mazo -->
  <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:26px;top:96px;width:350px;height:564px;box-sizing:border-box;border:3px solid #f4e7d0;border-radius:20px;overflow:hidden;background:#5e0c10;box-shadow:0 6px 16px rgba(0,0,0,0.35)">
      <div style="position:absolute;left:21px;top:19px;height:25px;box-sizing:border-box;display:flex;align-items:flex-start;padding:6px 10px;border-radius:12.5px;background:#f4e7d0">
        <p style="margin:0;font-weight:800;font-size:11px;line-height:13px;letter-spacing:1.4px;text-transform:uppercase;color:#1a1411;white-space:nowrap">Fin del mazo</p>
      </div>
      <div style="position:absolute;left:21px;top:62px;width:290px;display:flex;flex-direction:column;gap:4px">
        <p style="margin:0;font-style:italic;font-weight:600;font-size:22px;line-height:22px;color:#f2b544">cuando salen los créditos…</p>
        <p style="margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:56px;line-height:52px;text-transform:uppercase;color:#f4e7d0">Mazo terminado</p>
        <p style="margin:6px 0 0;font-weight:400;font-size:14px;line-height:19.6px;color:#d9c7a8">Viste las 10 cartas de {{deckTitle}}.</p>
      </div>
      <!-- Tus ○ de este mazo: los pósters que marcaste "Quiero verla" -->
      <sc-if value="{{hasWants}}" hint-placeholder-val="{{ true }}">
        <div style="position:absolute;left:0;top:246px;width:344px;height:134px;display:flex;align-items:center;justify-content:center">
          <sc-for list="{{wants}}" as="w" hint-placeholder-count="3">
            <div style="flex:none;position:relative;box-sizing:border-box;width:84px;height:124px;margin-left:{{w.ml}}px;padding:3px;border-radius:6px;background:#1a1411;box-shadow:0 7px 12px rgba(0,0,0,0.4);transform:rotate({{w.rot}}deg);z-index:{{w.z}};overflow:hidden">
              <sc-if value="{{w.hasImg}}" hint-placeholder-val="{{ true }}">
                <img src="{{w.img}}" alt="{{w.title}}" draggable="false" style="display:block;width:100%;height:100%;object-fit:cover;object-position:{{w.pos}};border-radius:3px;pointer-events:none">
              </sc-if>
              <sc-if value="{{w.noImg}}" hint-placeholder-val="{{ false }}">

  const clamp = (v) => Math.max(0, Math.min(1, v));

  const BG = { ritmo: '#e8642c', tono: '#b83a26', historia: '#f2b544', visual: '#8e3714' };
  const LBL = { ritmo: 'Ritmo', tono: 'Tono', historia: 'Historia', visual: 'Visual' };
  const TONE = {
    'melancólico': { name: 'Melancólico', moon: true, sub: 'tristeza bonita', line: 'deja una tristeza bonita, de esas que se quedan contigo.' },
    'nostálgico': { name: 'Nostálgico', moon: false, sub: 'añoranza dulce', line: 'te hace extrañar algo que ya pasó, aunque no lo hayas vivido.' },
    'oscuro': { name: 'Oscuro', moon: true, sub: 'sombras y peso', line: 'se queda en las sombras: te inquieta y te hace pensar.' },
    'cálido': { name: 'Cálido', moon: false, sub: 'abrazo suave', line: 'te deja el corazón tibio, con ganas de quedarte.' },
    'divertido': { name: 'Divertido', moon: false, sub: 'risa fácil', line: 'te deja liviano, con ganas de repetir los chistes.' },
    'inquietante': { name: 'Inquietante', moon: true, sub: 'miedo que se queda', line: 'se te mete bajo la piel y no se va cuando apagas la luz.' },
    'intenso': { name: 'Intenso', moon: false, sub: 'adrenalina pura', line: 'te tiene al borde del asiento de principio a fin.' }
  };
  const PH = ['#e8642c', '#b83a26', '#8e3714'];
  const mk = (o) => o;
  const KD = this._kd();
  const CARDS = KD.cards;

  const raw = CARDS[Math.min(idx, TOTAL - 1)];
  const T = TONE[raw.tono];
  const card = {
    kicker: raw.kicker, premise: raw.premise, match: raw.match, tags: raw.tags, similar: raw.similar,
    title: raw.title, subtitle: raw.subtitle, dur: raw.dur, genre: raw.genre, year: raw.year, desc: raw.desc,
    titleSize: raw.title.length <= 12 ? 40 : (raw.title.length <= 16 ? 36 : (raw.title.length <= 20 ? 31 : 27)),
    premSize: raw.premise.length <= 34 ? 30 : 22, premLh: raw.premise.length <= 34 ? 27.6 : 20.5,
    platN: raw.platN, platLogo: raw.platLogo, platBg: raw.platBg, platPad: raw.platPad,
    hasImg: !!raw.img, noImg: !raw.img, img: raw.img, phBg: PH[idx % 3],
    imgStyle: 'position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:' + (raw.pos || '50% 50%') + ';pointer-events:none',
    rows: raw.rows.map((r) => ({
      label: LBL[r[0]], value: r[1], sub: r[2], bg: BG[r[0]],
      isRitmo: r[0] === 'ritmo', isTono: r[0] === 'tono', notTono: r[0] !== 'tono',
      aria: 'Qué significa ' + LBL[r[0]], open: (e) => { e.stopPropagation(); openSheet(r[0]); },
      isHistoria: r[0] === 'historia', isVisual: r[0] === 'visual', sparkle: idx === 0 && r[0] === 'visual'
    }))
  };

  const KEYS = ['ritmo', 'tono', 'historia', 'visual'];
  const OTHERS = {
    ritmo: ['pausado', 'fluido', 'vibrante', 'tenso'],
    tono: ['melancólico', 'nostálgico', 'oscuro', 'cálido'],
    historia: ['épica', 'íntima', 'romántica', 'misteriosa'],
    visual: ['inmenso', 'colorido', 'onírico', 'urbano']
  };
  const DEF = {
    ritmo: 'La velocidad a la que avanza la historia: si se toma su tiempo o no te suelta ni un segundo.',
    tono: 'La emoción que te deja en el cuerpo: cómo te sientes mientras la ves y cuando salen los créditos.',
    historia: 'El tipo de historia que cuenta: qué tan grande es lo que está en juego y para quién.',
    visual: 'Cómo se ve la película: los colores, la luz y la escala con la que te entra por los ojos.'
  };
  const OTHERS_T = { ritmo: 'Otros ritmos', tono: 'Otras formas de tono', historia: 'Otras formas de historia', visual: 'Otros estilos visuales' };
  const kinds = (k, v) => ({
    kMoon: k === 'tono' && TONE[v] ? !!TONE[v].moon : false,
    kSun: k === 'tono' && TONE[v] ? !TONE[v].moon : false,
    kRitmo: k === 'ritmo', kHistoria: k === 'historia', kVisual: k === 'visual'
  });
  const sk = S.sheet || null;
  const rowOf = (k) => raw.rows.filter((r) => r[0] === k)[0];
  let sheetD = { eyebrow: '', title: '', bg: '#b83a26', ink: '#f4e7d0', word: '', def: '', name: '', line: '', others: '', opts: [], kMoon: false, kSun: false, kRitmo: false, kHistoria: false, kVisual: false };
  if (sk && sk !== 'adn') {
    const r = rowOf(sk); const cur = r[1];
    let list = OTHERS[sk].slice(); if (list.indexOf(cur) < 0) list[3] = cur;
    const isT = sk === 'tono';
    sheetD = Object.assign({
      eyebrow: 'qué es ' + (sk === 'ritmo' ? 'el ritmo' : sk === 'tono' ? 'el tono' : sk === 'historia' ? 'la historia' : 'lo visual'),
      title: LBL[sk], bg: BG[sk], ink: sk === 'historia' ? '#1a1411' : '#f4e7d0', word: cur, def: DEF[sk],
      name: isT ? T.name : cur.charAt(0).toUpperCase() + cur.slice(1),
      line: isT ? T.line : r[2] + '.',
      others: OTHERS_T[sk],
      opts: list.map((v) => Object.assign({ label: isT && v === 'cálido' ? 'Calido' : v, op: v === cur ? 1 : 0.55 }, kinds(sk, v)))
    }, kinds(sk, cur));
  }
  const sheetShow = !!S.sheetShow;

  // ADN de cada película (datos de ejemplo, mismo orden que CARDS)
  const ADN = CARDS.map((c) => c.adn);
  const A = ADN[Math.min(idx, TOTAL - 1)];
  const adnD = {
    phrase: A.phrase,
    themes: A.themes.map((t) => ({ label: t })),
    similar: A.sim.map((m, i) => ({ title: m[0], year: m[1], img: m[2], bg: PH[i % 3] })),
    feel: raw.rows.map((r) => Object.assign({ label: LBL[r[0]], value: r[1], bg: BG[r[0]] }, kinds(r[0], r[1])))
  };

  const segs = [];
  for (let i = 0; i < TOTAL; i++) segs.push({ bg: i <= Math.min(idx, TOTAL - 1) && (i < idx || !isDone || true) && i <= idx ? '#5e0c10' : '#3a2c22' });

  let tx = dx, ty = dy, rot = dx * 0.05;
  if (exit === 'want') { tx = 560; ty = 30; rot = 18; }
  if (exit === 'pass') { tx = -560; ty = 30; rot = -18; }
  if (exit === 'seen') { tx = 0; ty = -760; rot = 0; }
  // En reposo no hay transformaciones 3D ni capas compuestas: el texto se re-rasteriza nítido a cualquier zoom.
  const flipping = !!S.flipping;
  const atRest = !drag && !exit && dx === 0 && dy === 0;
  const dragT = atRest ? 'none' : 'translate(' + tx + 'px,' + ty + 'px) rotate(' + rot + 'deg)';
  const dragTr = exit ? 'transform .3s ease-in' : (drag || !anim ? 'none' : 'transform .25s ease');
  const flipT = flipping ? 'rotateY(' + (flipped ? 180 : 0) + 'deg)' : 'none';
  const flipTr = (flipping && S.fready) ? 'transform .55s cubic-bezier(.4,.2,.2,1)' : 'none';

  const commit = (kind) => {
    const s = st();
    if (s.exit || (s.idx || 0) >= TOTAL) return;
    if (kind === 'seen' && !s.flipped) return;
    this.setState({ exit: kind, drag: false });
    try { window.localStorage.setItem('kinoo.res', JSON.stringify({ d: KD.ix, r: (s.results || []).concat([kind]) })); } catch (_) {}
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      const c = st();
      this.setState({ results: (c.results || []).concat([kind]), idx: (c.idx || 0) + 1, flipped: false, flipping: false, fready: false, exit: null, dx: 0, dy: 0, anim: false });
      clearTimeout(this._t2);
      this._t2 = setTimeout(() => this.setState({ anim: true }), 80);
    }, 300);
  };

  const onDown = (e) => {
    const s = st();
    if (s.exit) return;
    const el = e.currentTarget;
    const r = el.getBoundingClientRect();
    this._k = (r.width / 350) || 1;
    this._sx = e.clientX; this._sy = e.clientY;
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    this.setState({ drag: true, dx: 0, dy: 0 });
  };
  const onMove = (e) => {
    const s = st();
    if (!s.drag) return;
    let mx = (e.clientX - this._sx) / this._k;
    let my = (e.clientY - this._sy) / this._k;
    if (my > 0) my = my * 0.2;
    if (my < 0 && !s.flipped) my = my * 0.15;
    this.setState({ dx: mx, dy: my });
  };
  const onUp = (e) => {
    const s = st();
    if (!s.drag) return;
    const mx = s.dx || 0, my = s.dy || 0;
    if (Math.abs(mx) < 6 && Math.abs(my) < 6) {
      this.setState({ drag: false, dx: 0, dy: 0 });
      if (!s.flipping) {
        // 1) entra en modo 3D sin transición (misma imagen)  2) gira una sola vez  3) vuelve a reposo sin transición
        this.setState({ flipping: true, fready: false });
        clearTimeout(this._t5); clearTimeout(this._t6);
        this._t5 = setTimeout(() => {
          this.setState({ fready: true, flipped: !st().flipped });
          this._t6 = setTimeout(() => this.setState({ flipping: false, fready: false }), 620);
        }, 50);
      }
    } else if (mx > 90) { commit('want'); }
    else if (mx < -90) { commit('pass'); }
    else if (my < -90 && s.flipped) { commit('seen'); }
    else { this.setState({ drag: false, dx: 0, dy: 0 }); }
  };
  const onCancel = () => { this.setState({ drag: false, dx: 0, dy: 0 }); };

  const nWant = results.filter((r) => r === 'want').length;
  const nSeen = results.filter((r) => r === 'seen').length;
  const nPass = results.filter((r) => r === 'pass').length;
  const ROT = [-7, 4, -3, 6, -5];
  const wantedAll = [];
  results.forEach((r, i) => { if (r === 'want' && CARDS[i]) wantedAll.push(CARDS[i]); });
  const wantedShown = wantedAll.slice(0, 5);
  const wants = wantedShown.map((c, i) => ({
    img: c.img, pos: c.pos || '50% 50%', title: c.title, hasImg: !!c.img, noImg: !c.img,
    bg: PH[i % 3], ml: i === 0 ? 0 : -28, rot: ROT[i], z: i + 1
  }));

  const openSheet = (k) => {
    clearTimeout(this._t3); clearTimeout(this._t4);
    this.setState({ sheet: k, sheetShow: false });
    this._t4 = setTimeout(() => this.setState({ sheetShow: true }), 30);
  };
  const closeSheet = () => {
    clearTimeout(this._t4); clearTimeout(this._t3);
    this.setState({ sheetShow: false });
    this._t3 = setTimeout(() => this.setState({ sheet: null }), 340);
  };

  return {
    deckTitle: KD.title,
    chip: isDone ? 'Fin del mazo' : 'Premisa',
    counter: Math.min(idx + 1, TOTAL) + ' de ' + TOTAL,
    segs, card, sheetD, adnD,
    inDeck, isDone,
    showNext: idx < TOTAL - 1 || (idx === TOTAL - 1 && !!exit === false && false),
    dragT, dragTr, flipT, flipTr,
    persp: flipping ? '1400px' : 'none', ts: flipping ? 'preserve-3d' : 'flat', bfv: flipping ? 'hidden' : 'visible',
    backT: flipping ? 'rotateY(180deg)' : 'none',
    frontVis: (flipping || !flipped) ? 'visible' : 'hidden', backVis: (flipping || flipped) ? 'visible' : 'hidden',
    opWant: drag || exit === 'want' ? clamp(dx / 90) + (exit === 'want' ? 1 : 0) : 0,
    opPass: drag || exit === 'pass' ? clamp(-dx / 90) + (exit === 'pass' ? 1 : 0) : 0,
    opSeen: (drag && flipped && Math.abs(dy) > Math.abs(dx)) || exit === 'seen' ? clamp(-dy / 90) + (exit === 'seen' ? 1 : 0) : 0,
    onDown, onMove, onUp, onCancel,
    stop: (e) => { e.stopPropagation(); },
    closeSheet,
    sheetMounted: !!sk, aspectPanel: !!sk && sk !== 'adn', adnPanel: sk === 'adn',
    openAdn: (e) => { e.stopPropagation(); openSheet('adn'); }, sheetBackOp: sheetShow ? 1 : 0, sheetY: sheetShow ? '0px' : '500px',
    doPass: () => commit('pass'),
    doWant: () => commit('want'),
    doSeen: () => commit('seen'),
    seenOff: !flipped,
    seenOp: flipped ? 1 : 0.45,
    seenCursor: flipped ? 'pointer' : 'default',
    seenLabel: flipped ? 'Ya la vi' : 'Revela primero',
    nWant, nSeen, nPass, wants, hasWants: wants.length > 0, noWants: wants.length === 0,
    // Al salir hacia el Resumen, el mazo se reinicia: al volver a Descubrir arranca un mazo nuevo.
    newDeckOnLeave: () => {
      clearTimeout(this._t7);
      this._t7 = setTimeout(() => { try { this.setState({ idx: 0, results: [], flipped: false, flipping: false, fready: false, exit: null, dx: 0, dy: 0, anim: false, sheet: null, sheetShow: false }); setTimeout(() => { try { this.setState({ anim: true }); } catch (_) {} }, 80); } catch (_) {} }, 400);
    },
    restart: () => this.setState({ idx: 0, results: [], flipped: false, flipping: false, fready: false, exit: null, dx: 0, dy: 0, anim: false, sheet: null, sheetShow: false })
  };
}
componentWillUnmount() { clearTimeout(this._t); clearTimeout(this._t2); clearTimeout(this._t3); clearTimeout(this._t4); clearTimeout(this._t5); clearTimeout(this._t6); }
}
</script>
<script src="../runtime/preact.min.umd.js"></script>
<script src="../runtime/kinoo-dc.js"></script>
</body>
