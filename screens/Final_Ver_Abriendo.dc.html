<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402, user-scalable=no">
<title>Kinoo · Ver · Abriendo plataforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
.kscroll{scrollbar-width:none;-ms-overflow-style:none}
.kscroll::-webkit-scrollbar{display:none}
@keyframes kin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes kfade{from{opacity:0}to{opacity:1}}
@keyframes kpop{0%{transform:scale(1)}35%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes kbump{0%{transform:rotate(4deg) scale(1)}35%{transform:rotate(-8deg) scale(1.3)}100%{transform:rotate(4deg) scale(1)}}
@keyframes kspin{to{transform:rotate(1turn)}}
@keyframes kfill{from{width:0}to{width:100%}}
@keyframes kshake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes kdeal{from{transform:translateY(-120px) scale(.75) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes kwig{0%,80%,100%{rotate:0deg}85%{rotate:-3deg}90%{rotate:3deg}95%{rotate:-2deg}}
@keyframes kpulse{50%{transform:scale(1.12)}}
@keyframes kblink{50%{opacity:.25}}
@keyframes kchev{50%{transform:translateY(4px)}}
@keyframes kmodal{from{transform:translateY(40px) scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes knotif{from{transform:translateY(-140px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes kwave{0%,100%{height:4px}50%{height:18px}}
.kin{animation:kin .45s cubic-bezier(.2,.9,.25,1.05) both}
.kfade{animation:kfade .3s ease both}
.kpop{animation:kpop .4s ease-out}
.kbump{animation:kbump .6s cubic-bezier(.3,1.7,.5,1)}
.kspin{animation:kspin 40s linear infinite}
.kfill{animation:kfill 2200ms linear both}
.kshake{animation:kshake .4s}
.kdeal{animation:kdeal .55s cubic-bezier(.2,.9,.25,1.1) both}
.kwig{animation:kwig 1.8s ease-in-out infinite}
.kpulse{animation:kpulse 1.4s ease-in-out infinite}
.kblink{animation:kblink 1.2s infinite}
.kchev{animation:kchev 1.6s ease-in-out infinite}
.kmodal{animation:kmodal .5s cubic-bezier(.2,.9,.25,1.15) both}
.knotif{animation:knotif .7s .4s cubic-bezier(.2,.9,.25,1.15) both}
.kwave{animation:kwave .7s ease-in-out infinite}

/* ---- Kinoo · motion v1 ---- */
:root{--k-ease:cubic-bezier(.2,.8,.2,1);--k-in:cubic-bezier(.5,0,.75,0);--k-spring:cubic-bezier(.3,1.4,.5,1)}
@keyframes kscreen{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kstagger{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes kfanin{from{opacity:0;transform:translateY(46px) scale(.9)}to{opacity:1;transform:none}}
@keyframes kdealf{from{opacity:.4;transform:translateY(14px) scale(.93)}to{opacity:1;transform:none}}
@keyframes kdealin{from{opacity:0;transform:translateY(-70px) rotate(-7deg) scale(.88)}to{opacity:1;transform:none}}
@keyframes kswap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kgrow{from{transform:scaleX(0)}to{transform:none}}
@keyframes knudge{50%{transform:translate(3px,-3px)}}
.kfin{animation:kscreen .42s var(--k-ease) both}
.kpress{transition:transform .14s var(--k-ease),filter .14s}
.kpress:active{transform:scale(.97);filter:brightness(1.08)}
.kstag>*{animation:kstagger .5s var(--k-ease) both}
.kstag>*:nth-child(1){animation-delay:.04s}.kstag>*:nth-child(2){animation-delay:.09s}.kstag>*:nth-child(3){animation-delay:.14s}.kstag>*:nth-child(4){animation-delay:.19s}
.kstag>*:nth-child(5){animation-delay:.24s}.kstag>*:nth-child(6){animation-delay:.29s}.kstag>*:nth-child(7){animation-delay:.34s}.kstag>*:nth-child(8){animation-delay:.39s}
.kfan{animation:kfanin .6s var(--k-spring) both}
.kdealf{animation:kdealf .34s var(--k-spring) both}
.kdealin{animation:kdealin .52s var(--k-spring) both}
.kswap{animation:kswap .3s var(--k-ease) both}
.knudge{display:inline-block;animation:knudge 1.6s var(--k-ease) infinite}
a,button,[role=button]{-webkit-tap-highlight-color:transparent}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
<style>html,body{margin:0;background:#17120f;-webkit-tap-highlight-color:transparent;scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}#kdc-root{width:402px;margin:0 auto}</style>
</head>
<body>
<div id="kdc-root"></div>
<template id="kdc-tpl">

<div class="kfin" ref="{{setRoot}}" style="position:relative;width:402px;height:844px;overflow:hidden;background:#000;font-family:'Figtree',sans-serif;color:#f4e7d0;user-select:none">
  <a ref="{{setA}}" href="Final_Ver_Funcion.dc.html" aria-label="Continuar" style="position:absolute;inset:0;display:block">
    <sc-if value="{{run}}" hint-placeholder-val="{{ true }}">
    <div class="kin" style="position:absolute;left:153px;top:330px;width:96px;height:96px;border-radius:22px;overflow:hidden;background:#000"><img src="../assets/7fd3c7c583a108305af99cef1d3496e0.png" alt="Prime Video" width="96" height="96"></div>
    <div style="position:absolute;left:36px;right:36px;top:452px;text-align:center"><p style="margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:30px;text-transform:uppercase;color:#f4e7d0">Te llevamos a Prime Video</p><p style="margin:6px 0 0;font-weight:600;font-size:13px;line-height:19px;color:#bfa98a">Dale play allá. Kinoo te avisa en los momentos clave para que juegues sin perderte nada.</p></div>
    <div style="position:absolute;left:101px;right:101px;top:560px;height:4px;border-radius:2px;background:#222;overflow:hidden"><div class="kfill" style="height:100%;background:#e8642c"></div></div>
    <p style="position:absolute;left:0;right:0;top:580px;margin:0;text-align:center;font-weight:600;font-size:11px;color:#6b5844">toca para seguir</p>
    </sc-if>
  </a>

</div>
</template>
<script type="text/x-dc" id="kdc-logic">
class Component extends DCLogic {
renderVals() {
  if (!this._sr) { this._sr = (el) => this._setRoot(el); this._sa = (el) => { if (el) this._a = el; }; }
  return { setRoot: this._sr, setA: this._sa, run: (this.state || {}).run !== false };
}
_start() { this.setState({ run: false }); setTimeout(() => this.setState({ run: true }), 20); clearTimeout(this._t); this._t = setTimeout(() => { try { (this._a || document.querySelector('a[href="Final_Ver_Funcion.dc.html"]')).click(); } catch (_) {} }, 2600); }
_stop() { clearTimeout(this._t); }
_setRoot(el) {
  if (!el || this._obs || typeof IntersectionObserver === 'undefined') return;
  this._obs = new IntersectionObserver((es) => { const e = es[es.length - 1]; const v = e.isIntersecting && e.intersectionRatio >= 0.5; if (v && !this._live) { this._live = true; this._start(); } else if (!v && this._live) { this._live = false; this._stop(); } }, { threshold: [0, 0.5, 1] });
  this._obs.observe(el);
}
componentDidMount() { this._fb = setTimeout(() => { if (!this._obs && !this._live) { this._live = true; this._start(); } }, 400); }
componentWillUnmount() { this._stop(); clearTimeout(this._fb); if (this._obs) this._obs.disconnect(); }

}
</script>
<script src="../runtime/preact.min.umd.js"></script>
<script src="../runtime/kinoo-dc.js"></script>
</body>
</html>
