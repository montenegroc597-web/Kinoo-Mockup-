<style>
body{margin:0}
a{text-decoration:none;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
.kscroll{scrollbar-width:none;-ms-overflow-style:none}
.kscroll::-webkit-scrollbar{display:none}
@keyframes kin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes kfade{from{opacity:0}to{opacity:1}}
@keyframes kpop{0%{transform:scale(1)}35%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes kbump{0%{transform:rotate(4deg) scale(1)}35%{transform:rotate(-8deg) scale(1.3)}100%{transform:rotate(4deg) scale(1)}}
@keyframes kspin{to{transform:rotate(1turn)}}
@keyframes kfill{from{width:0}to{width:100%}}
@keyframes kshake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes kdeal{from{transform:translateY(-120px) scale(.75) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes kwig{0%,80%,100%{rotate:0deg}85%{rotate:-3deg}90%{rotate:3deg}95%{rotate:-2deg}}
@keyframes kpulse{50%{transform:scale(1.12)}}
@keyframes kblink{50%{opacity:.25}}
@keyframes kchev{50%{transform:translateY(4px)}}
@keyframes kmodal{from{transform:translateY(40px) scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes knotif{from{transform:translateY(-140px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes kwave{0%,100%{height:4px}50%{height:18px}}
.kin{animation:kin .45s cubic-bezier(.2,.9,.25,1.05) both}
.kfade{animation:kfade .3s ease both}
.kpop{animation:kpop .4s ease-out}
.kbump{animation:kbump .6s cubic-bezier(.3,1.7,.5,1)}
.kspin{animation:kspin 40s linear infinite}
.kfill{animation:kfill 2200ms linear both}
.kshake{animation:kshake .4s}
.kdeal{animation:kdeal .55s cubic-bezier(.2,.9,.25,1.1) both}
.kwig{animation:kwig 1.8s ease-in-out infinite}
.kpulse{animation:kpulse 1.4s ease-in-out infinite}
.kblink{animation:kblink 1.2s infinite}
.kchev{animation:kchev 1.6s ease-in-out infinite}
.kmodal{animation:kmodal .5s cubic-bezier(.2,.9,.25,1.15) both}
.knotif{animation:knotif .7s .4s cubic-bezier(.2,.9,.25,1.15) both}
.kwave{animation:kwave .7s ease-in-out infinite}

@keyframes kripple{from{transform:scale(.35);opacity:.85}to{transform:scale(2.3);opacity:0}}
@keyframes kslot{from{transform:translateY(0)}to{transform:translateY(-83.3333%)}}
@keyframes kphrase{0%{opacity:0;transform:translateY(10px)}6%,30%{opacity:1;transform:none}36%,100%{opacity:0;transform:translateY(-10px)}}
@keyframes kreveal{0%{transform:scale(.55) rotate(-10deg);opacity:0;filter:brightness(1.8)}55%{transform:scale(1.07) rotate(2deg);opacity:1}100%{transform:none;filter:none}}
@keyframes krays{from{transform:rotate(0) scale(.5);opacity:1}to{transform:rotate(50deg) scale(1.6);opacity:0}}
@keyframes ksunpulse{50%{transform:scale(1.08)}}
@keyframes ksheet{from{transform:translateY(105%)}to{transform:none}}
@keyframes kdim{from{opacity:0}to{opacity:1}}
@keyframes kbar{from{transform:scaleX(0)}to{transform:none}}
@keyframes kspark{0%{transform:scale(0) rotate(0);opacity:0}40%{opacity:1}100%{transform:scale(1.4) rotate(90deg);opacity:0}}
.kreveal{animation:kreveal .75s var(--k-spring) both}
.ksheet{animation:ksheet .45s var(--k-spring) both}
.kdim{animation:kdim .3s var(--k-ease) both}

/* ---- Kinoo · motion v1 ---- */
:root{--k-ease:cubic-bezier(.2,.8,.2,1);--k-in:cubic-bezier(.5,0,.75,0);--k-spring:cubic-bezier(.3,1.4,.5,1)}
@keyframes kscreen{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kstagger{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes kfanin{from{opacity:0;transform:translateY(46px) scale(.9)}to{opacity:1;transform:none}}
@keyframes kdealf{from{opacity:.4;transform:translateY(14px) scale(.93)}to{opacity:1;transform:none}}
@keyframes kdealin{from{opacity:0;transform:translateY(-70px) rotate(-7deg) scale(.88)}to{opacity:1;transform:none}}
@keyframes kswap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kgrow{from{transform:scaleX(0)}to{transform:none}}
@keyframes knudge{50%{transform:translate(3px,-3px)}}
.kfin{animation:kscreen .42s var(--k-ease) both}
.kpress{transition:transform .14s var(--k-ease),filter .14s}
.kpress:active{transform:scale(.97);filter:brightness(1.08)}
.kstag>*{animation:kstagger .5s var(--k-ease) both}
.kstag>*:nth-child(1){animation-delay:.04s}.kstag>*:nth-child(2){animation-delay:.09s}.kstag>*:nth-child(3){animation-delay:.14s}.kstag>*:nth-child(4){animation-delay:.19s}
.kstag>*:nth-child(5){animation-delay:.24s}.kstag>*:nth-child(6){animation-delay:.29s}.kstag>*:nth-child(7){animation-delay:.34s}.kstag>*:nth-child(8){animation-delay:.39s}
.kfan{animation:kfanin .6s var(--k-spring) both}
.kdealf{animation:kdealf .34s var(--k-spring) both}
.kdealin{animation:kdealin .52s var(--k-spring) both}
.kswap{animation:kswap .3s var(--k-ease) both}
.knudge{display:inline-block;animation:knudge 1.6s var(--k-ease) infinite}
a,button,[role=button]{-webkit-tap-highlight-color:transparent}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

    slot: this._slotFilms().map((x) => Object.assign(vis(x), { bgc: FILMS[x].pal ? FILMS[x].pal[1] : '#0c0a09' })),
    flipTxt: seenMode ? 'toca para ver lo que dijiste' : 'toca para ver por qué',
    backKick: seenMode ? 'lo que dijiste' : 'por qué es para ti',
    reasons: R.map(([k, v], i) => ({ k, v, dl: (0.06 + i * 0.07).toFixed(2) + 's' })),
    cardT, cardTr, cardSh: drag || fl ? '0 26px 40px rgba(0,0,0,.65)' : '0 18px 32px rgba(0,0,0,.55)',
    opR: drag ? Math.max(0, Math.min(1, -dx / 90)) : (exit < 0 ? 1 : 0), opL: drag ? Math.max(0, Math.min(1, dx / 90)) : (exit > 0 ? 1 : 0),
    dealCls: S.deal || '', swapCls: S.swap === false ? '' : 'kswap', popCls: S.pop ? 'kpop' : '',
    dots: list.map((x, i) => ({ w: i === idx ? 18 : 6, bg: i === idx ? '#f2b544' : '#5a4838' })),
    tkKick: seenMode ? 'Volver a verla · ahora' : 'Tu plan · ahora', tkBig: seenMode ? 'Repetirla' : (P.rent ? 'Alquilarla' : 'Verla ahora'), tkSub: 'en ' + P.n + ' · termina a las ' + ends,
    P: { n: P.n, logo: P.logo, bg: P.bg, pad: P.pad },
    isSaved: !!saved[id], notSaved: !saved[id], nSeen: SEEN.length,
    shelfCls: S.shelfIn ? 'kin' : '', shelfOp: S.shelfIn ? 1 : 0,
    shelf: SEEN.map((s, i) => Object.assign(vis(s.id), { rate: s.rate, dl: (i * 0.07).toFixed(2) + 's', bd: seenMode && s.id === id ? '#f2b544' : '#f4e7d0', pick: () => { this._toSeen(i); try { this._sc.scrollTo({ top: 0, behavior: 'smooth' }); } catch (_) {} } })),
    setScroll: this._ssr || (this._ssr = (el) => { if (el && el !== this._sc) { this._sc = el; el.addEventListener('scroll', () => { if (!(this.state || {}).shelfIn && el.scrollTop > 240) this.setState({ shelfIn: true }); }, { passive: true }); } }),
    toShelf: () => { this.setState({ shelfIn: true }); try { this._sc.scrollTo({ top: 690, behavior: 'smooth' }); } catch (_) {} },
    toNew: () => this._mood(mood),
    prevF: () => go(-1), nextF: () => { go(1); this._discard(); },
    stop: (e) => { e.stopPropagation(); },
    save: (e) => { e.stopPropagation(); const m = Object.assign({}, (this.state || {}).saved || {}); m[id] = !m[id]; this.setState({ saved: m, pop: false, miss: 0 }); setTimeout(() => this.setState({ pop: true }), 10); this._toast(m[id] ? f.t + ' queda para después' : 'La quitamos de para después'); },
    flipKey: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this._flip(); } if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); },
    onDown: (e) => { const s = this.state || {}; if (s.exit || s.fl) return; const r = e.currentTarget.getBoundingClientRect(); this._k = (r.width / 236) || 1; this._sx = e.clientX; this._sy = e.clientY; this._mv = 0; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} this.setState({ drag: true, dx: 0 }); },
    onMove: (e) => { if (!(this.state || {}).drag) return; this._mv = Math.max(this._mv || 0, Math.abs(e.clientX - this._sx) + Math.abs(e.clientY - this._sy)); this.setState({ dx: (e.clientX - this._sx) / this._k }); },
    onUp: () => { const s = this.state || {}; if (!s.drag) return; const d = s.dx || 0;
      if ((this._mv || 0) < 6) { this.setState({ drag: false, dx: 0 }); this._flip(); return; }
      if (Math.abs(d) > 90) { this.setState({ drag: false, exit: d < 0 ? -1 : 1 }); clearTimeout(this._te); this._te = setTimeout(() => { go(1); this._discard(); }, 280); return; }
      this.setState({ drag: false, dx: 0 }); },
    onCancel: () => this.setState({ drag: false, dx: 0 }),
    hasToast: !!S.toast, toast: S.toast || ''
  };
}
_flip() { const s = this.state || {}; if (s.fl) return; this.setState({ fl: 1 }); clearTimeout(this._tf); this._tf = setTimeout(() => { this.setState({ flipped: !(this.state || {}).flipped, fl: 2 }); this._tf = setTimeout(() => this.setState({ fl: 0 }), 300); }, 160); }
_discard() { const s = this.state || {}; if (s.mode === 'seen') return; const n = (s.miss || 0) + 1; const up = { miss: n }; if (n % 10 === 0) up.prompt = 'rest'; else if (n % 4 === 0) up.prompt = 'help'; this.setState(up); }
_slotFilms() { return ['matrix', 'ratatouille', 'sinners', 'grease', 'mickey', 'matrix']; }
_startWild() {
  const { FILMS, SEEN } = this._data();
  const s = this.state || {};
  const seen = SEEN.map((x) => x.id);
  const cur = this._list();
  const pool = Object.keys(FILMS).filter((x) => seen.indexOf(x) < 0 && cur.indexOf(x) < 0);
  const pick = pool.length ? pool[(s.wildN || 0) % pool.length] : cur[0];
  this.setState({ prompt: null, searching: true, miss: 0 });
  try { this._sc.scrollTo({ top: 0 }); } catch (_) {}
  clearTimeout(this._tw); this._tw = setTimeout(() => {
    this.setState({ searching: false, mode: 'new', wild: pick, wildN: (s.wildN || 0) + 1, idx: 0, flipped: false, fl: 0, deal: null, swap: false, burst: true });
    setTimeout(() => this.setState({ deal: 'kreveal', swap: true }), 16);
    setTimeout(() => this.setState({ burst: false }), 1100);
    this._toast('Tu comodín: ' + FILMS[pick].t);
  }, 2700);
}
_mood(m) { const { MOODS } = this._data(); this.setState({ mode: 'new', mood: m, idx: 0, wild: null, miss: 0, flipped: false, fl: 0, deal: null, swap: false }); setTimeout(() => this.setState({ deal: 'kdealin', swap: true }), 16); this._toast(MOODS.find((x) => x[0] === m)[1] + ' · ' + this._list().length + ' nuevas para ti'); }
_toSeen(i) { this.setState({ mode: 'seen', miss: 0, idx: i, flipped: false, fl: 0, deal: null, swap: false }); setTimeout(() => this.setState({ deal: 'kdealin', swap: true }), 16); }
_toast(t) { clearTimeout(this._tt); this.setState({ toast: t }); this._tt = setTimeout(() => this.setState({ toast: null }), 2000); }
componentWillUnmount() { clearTimeout(this._tt); clearTimeout(this._tf); clearTimeout(this._te); clearTimeout(this._tw); }
}
